# pnpm settings for this project.
#
# Supply-chain protection: a package version must have been published for at
# least one day (1440 minutes) before pnpm installs it. Malicious releases are
# usually spotted and pulled within hours. Do not lower or remove this.
minimumReleaseAge: 1440

# Packages allowed to run install scripts (esbuild checks its native binary).
allowBuilds:
  esbuild: true
