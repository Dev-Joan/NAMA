kind = "web"
previewPath = "/"
title = "NAMA Polyclinic"
description = "A warm, trustworthy French-first one-page website for NAMA Polyclinic in Jal El Dib, helping families discover specialties and book care with confidence."
version = "1.0.0"
id = "artifacts/nama-polyclinic"
router = "path"

[[services]]
name = "web"
paths = [ "/" ]
localPort = 24017

[services.development]
run = "pnpm --filter @workspace/nama-polyclinic run dev"

[services.production]
build = [ "pnpm", "--filter", "@workspace/nama-polyclinic", "run", "build" ]
serve = "static"
publicDir = "artifacts/nama-polyclinic/dist/public"

[[services.production.rewrites]]
from = "/*"
to = "/index.html"

[services.env]
PORT = "24017"
BASE_PATH = "/"
